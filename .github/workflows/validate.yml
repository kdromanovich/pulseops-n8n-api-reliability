name: Workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check workflow structure
        run: python3 scripts/validate_workflow.py

      - name: Compile every Code node
        run: node scripts/check-code-syntax.mjs

      - name: Run offline workflow scenarios
        run: node scripts/run-demo-path.mjs

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
